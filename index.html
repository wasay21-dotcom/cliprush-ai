
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipRush AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#090b12;color:white;
font-family:Arial,sans-serif;
display:flex;justify-content:center;
align-items:center;min-height:100vh;padding:20px
}
.container{
width:100%;max-width:650px;text-align:center;
background:#141824;padding:35px 22px;
border:1px solid #292f40;border-radius:22px
}
h1{font-size:38px;margin:0 0 10px}
h1 span{color:#8b5cf6}
p{color:#aab0c0;line-height:1.6}
input{
width:100%;padding:17px;border-radius:12px;
border:1px solid #353b4c;background:#090d17;
color:white;font-size:15px;margin:20px 0
}
button{
width:100%;padding:16px;border:0;
border-radius:12px;background:#8055ed;
color:white;font-size:16px;font-weight:bold
}
#result{margin-top:20px;color:#c4b5fd}
.small{font-size:12px;margin-top:25px}
</style>
</head>
<body>
<div class="container">
<h1>ClipRush <span>AI</span></h1>
<p>Turn long videos into short clips.<br>Fast. Simple. AI-powered.</p>

<input id="videoUrl" type="url"
placeholder="Paste your YouTube video URL">

<button onclick="analyse()">Find Best Moments</button>

<div id="result"></div>
<p class="small">ClipRush AI • Your video clipping workspace</p>
</div>

<script>
async function analyse(){
const url=document.getElementById("videoUrl").value.trim();
const result=document.getElementById("result");

if(!url){
result.textContent="Please paste a YouTube URL first.";
return;
}

result.textContent="Sending your link...";

try{
const response=await fetch("https://YOUR-VERCEL-DOMAIN/analyse",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url:url})
});
const data=await response.json();
result.textContent=data.message || data.error || "Request completed.";
}catch(error){
result.textContent="Connection error. Check backend URL.";
}
}
</script>
</body>
</html>
